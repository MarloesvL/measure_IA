site_name: MeasureIA Documentation
site_description: Measurement of intrinsic alignment correlation functions
site_author: Marloes van Heukelum
nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Installation: installation.md
  - Guides:
      - Input: input.md
      - Usage: usage.md
      - Output: output_structure.md
      - Per-galaxy contributions: galaxy_contributions.md
      - Included simulations: simulations.md
  - Concepts:
      - Conventions: conventions.md
      - Estimator definitions: estimator_definitions.md
  - Examples:
      - Simulation box: examples/example_MeasureIA_box.ipynb
      - Lightcone: examples/example_MeasureIA_lightcone.ipynb
  # Grouped under a caption of their own: the readthedocs theme renders a section as a
  # flat heading, so a bare top-level page here would read as part of Examples above.
  - Validation & performance:
      - Validation: validation.md
      - Performance: performance.md
  - API Reference:
      - MeasureIABox: api/measureIABox.md
      - MeasureIALightcone: api/measureIALightcone.md
      - MeasureIABase: api/MeasureIABase.md
      - MeasureJackknife: api/MeasureJackknife.md
      - Box backends:
          - MeasureWBox: api/MeasureWBox.md
          - MeasureMultipolesBox: api/MeasureMBox.md
          - MeasureWBoxJackknife: api/MeasureWBoxJackknife.md
          - MeasureMBoxJackknife: api/MeasureMBoxJackknife.md
      - Lightcone backends:
          - MeasureWLightcone: api/MeasureWLightcone.md
          - MeasureMultipolesLightcone: api/MeasureMLightcone.md
          - MeasureWLightconeJackknife: api/MeasureWLightconeJackknife.md
          - MeasureMultipolesLightconeJackknife: api/MeasureMLightconeJackknife.md
      - pair_kernel: api/pair_kernel.md
      - SimInfo: api/SimInfo.md
      - ReadData: api/ReadData.md
      - mocks: api/mocks.md
theme: readthedocs
hooks:
  # Copies examples/*.ipynb into docs/examples/ so mkdocs-jupyter can pick them up.
  - mkdocs_hooks/copy_notebooks.py

plugins:
  - search
  # The example notebooks are executed at build time, so the site shows the real
  # measurement and its plots, and a broken notebook fails the build (--strict).
  - mkdocs-jupyter:
      # Only the example notebooks; without this the plugin also grabs any .py in docs/.
      include: ["examples/*.ipynb"]
      execute: true
      allow_errors: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: numpy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js