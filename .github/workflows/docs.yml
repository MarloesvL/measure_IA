name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/**'          # docstrings feed the mkdocstrings API reference
      - 'pyproject.toml'  # the docs dependency group
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow the job to push the built site to the gh-pages branch.
permissions:
  contents: write

# Never let two deploys race for the gh-pages branch.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gh-deploy commits to and pushes the gh-pages branch

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure git for the gh-pages commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Fail fast on broken links / missing references before publishing.
      - name: Build (strict)
        run: uv run --group docs mkdocs build --strict

      - name: Deploy to gh-pages
        run: uv run --group docs mkdocs gh-deploy --force --no-history
